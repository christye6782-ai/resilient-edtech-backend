# ResilientEdTech — Anaconda environment
#
# Create:   conda env create -f environment.yml
# Activate: conda activate resilient-edtech
# Run:      uvicorn app.main:app --reload
#
# NOTE on OCR: pytesseract is only a wrapper around the Tesseract OCR engine.
# Install the engine itself separately:
#   - Windows: https://github.com/UB-Mannheim/tesseract/wiki  (then add it to PATH,
#              or set TESSERACT_CMD in your .env to the tesseract.exe path)
#   - conda:   conda install -c conda-forge tesseract
# The app still runs without it — it falls back to direct text/PDF/DOCX extraction.

name: resilient-edtech
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - tesseract                 # OCR engine (conda-forge build)
  - pip:
      - fastapi==0.115.6
      - uvicorn[standard]==0.34.0
      - python-multipart==0.0.18
      - pydantic==2.10.4
      - python-dotenv==1.0.1
      - ollama==0.4.5
      - opencv-python-headless==4.10.0.84
      - numpy==2.1.3
      - pytesseract==0.3.13
      - Pillow==11.0.0
      - pypdf==5.1.0
      - python-docx==1.1.2
      - reportlab>=4.0
