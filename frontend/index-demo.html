document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n          <sc-for list=\"{{ footQuickLinks }}\" as=\"q\" hint-placeholder-count=\"4\">\n            <span style=\"font-size:.88rem;color:#c7d4e2;font-weight:500;cursor:default;\">{{ q }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:.76rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8ba6c4;margin-bottom:16px;\">{{ s.footAboutTitle }}<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:16px;\">\n          <sc-for list=\"{{ footAboutLinks }}\" as=\"q\" hint-placeholder-count=\"3\">\n            <span style=\"font-size:.88rem;color:#c7d4e2;font-weight:500;cursor:default;\">{{ q }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:8px;padding:8px 12px;\">\n          <span style=\"width:8px;height:8px;border-radius:50%;background:#33a94a;box-shadow:0 0 0 3px rgba(51,169,74,.25);\"><\u002Fspan>\n          <span style=\"font-size:.8rem;font-weight:600;color:#dbe6f1;\">{{ s.offline }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(255,255,255,.1);\">\n      <div data-pad=\"\" style=\"max-width:1180px;margin:0 auto;padding:16px 28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.8rem;color:#8ba6c4;font-weight:500;\">\n        <span>{{ s.footCopyright }}<\u002Fspan>\n        <span>{{ s.footR }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;downloadUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://github.com/christye6782-ai/resilient-edtech-backend/releases/download/v1.0.0/ResilientEdTech-Setup.exe&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Peer review&quot;,&quot;label&quot;:&quot;Installer download URL&quot;}}\">\nclass Component extends DCLogic {\n  state = { lang: \"en\", constraints: { no_internet: false, limited_connectivity: false, unstable_power: false, mixed_ability: false, large_class: false, restricted_hardware: false }, analyzing: false, showResults: false, faqQuery: \"\", faqItems: [], activeTab: \"input\", fileName: \"\", dragOver: false, subjectInput: \"\", formInput: \"\", topicInput: \"\", lessonText: \"\", live: null, dataSource: \"demo\", extracting: false, extractInfo: null, recent: [], plansBackend: false, memoryOn: true, memoryPrefilled: false, teacherId: 1, teachers: [{ id: 1, name: \"Teacher\" }], showProfiles: false, addingProfile: false, newProfileName: \"\", fbPlanId: null, fbRating: 0, fbTools: {}, fbNotes: \"\", fbSaved: false, reflection: null, profile: null, suggestion: null, suggestionDismissed: false, suggestionApplied: false, modelChoices: [{ id: \"llama3.2:1b\", label: \"Fast (1B) — weakest devices\" }, { id: \"llama3.2:3b\", label: \"Balanced (3B) — default\" }, { id: \"llama3.1:8b\", label: \"Best quality (8B) — stronger BM\" }], modelValue: \"llama3.2:3b\", runError: null, diag: null, diagErr: null, diagLoading: false, diagCopied: false, engineLive: false, engineKnown: false };\n\n  RECENT_KEY = \"ret_recent_plans_v1\";\n  MEMORY_KEY = \"ret_memory_on_v1\";\n  TEACHER_KEY = \"ret_teacher_id_v1\";\n  TEACHERS_KEY = \"ret_teachers_v1\";\n  recentKey() { return this.RECENT_KEY + \"_t\" + this.state.teacherId; }\n\n  // --- Subject / year pickers ---------------------------------------------\n  // Free text let \"english\", \"Bahasa Inggeris\" and typos all reach the RAG\n  // subject filter differently, and a blank field was part of what allowed a\n  // wrong form to be copied into a plan. These are the KSSR primary subjects.\n  subjectList(L) {\n    return L === \"en\"\n      ? [\"English\", \"Bahasa Melayu\", \"Mathematics\", \"Science\", \"Sejarah\",\n         \"Pendidikan Islam\", \"Pendidikan Moral\", \"Pendidikan Jasmani dan Kesihatan\",\n         \"Pendidikan Seni Visual\", \"Pendidikan Muzik\",\n         \"Reka Bentuk dan Teknologi\", \"Teknologi Maklumat dan Komunikasi\"]\n      : [\"Bahasa Inggeris\", \"Bahasa Melayu\", \"Matematik\", \"Sains\", \"Sejarah\",\n         \"Pendidikan Islam\", \"Pendidikan Moral\", \"Pendidikan Jasmani dan Kesihatan\",\n         \"Pendidikan Seni Visual\", \"Pendidikan Muzik\",\n         \"Reka Bentuk dan Teknologi\", \"Teknologi Maklumat dan Komunikasi\"];\n  }\n\n  formList(L) {\n    const y = L === \"en\" ? \"Year\" : \"Tahun\";\n    const f = L === \"en\" ? \"Form\" : \"Tingkatan\";\n    return [1, 2, 3, 4, 5, 6].map(n => y + \" \" + n)\n      .concat([1, 2, 3, 4, 5].map(n => f + \" \" + n));\n  }\n\n  // Only these three have an offline DSKP corpus indexed, so only these get\n  // curriculum grounding. Saying so is more useful than implying otherwise.\n  isGroundedSubject(raw) {\n    const s = String(raw || \"\").toLowerCase();\n    return [\"english\", \"bahasa inggeris\", \"math\", \"matematik\", \"mathematics\",\n            \"science\", \"sains\"].some(k => s.includes(k));\n  }\n\n  buildOptions(list, current, placeholder) {\n    const opts = [{ value: \"\", label: placeholder || \"—\" }];\n    // Preserve a value that predates these lists (older saved plans held free\n    // text) so the select never blanks out a teacher's stored choice.\n    if (current && !list.includes(current)) opts.push({ value: current, label: current });\n    list.forEach(v => opts.push({ value: v, label: v }));\n    return opts;\n  }\n\n\n  // --- Run progress -------------------------------------------------------\n  // The backend answers a run as one POST, so there are no per-agent events to\n  // subscribe to. The three stages are real and always run in this order, so\n  // naming them and advancing on elapsed time is honest about the sequence\n  // while being an estimate about the timing. What matters is that a teacher\n  // waiting two minutes on a school laptop can see the app is working: an\n  // unlabelled spinner at that length reads as a hang, and they restart it.\n  startRunProgress() {\n    this.stopRunProgress();\n    this._runStart = Date.now();\n    this.setState({ runElapsed: 0 });\n    this._runTimer = setInterval(() => {\n      this.setState({ runElapsed: Math.floor((Date.now() - this._runStart) / 1000) });\n    }, 1000);\n  }\n\n  stopRunProgress() {\n    if (this._runTimer) { clearInterval(this._runTimer); this._runTimer = null; }\n  }\n\n  componentWillUnmount() {\n    this.stopRunProgress();\n  }\n\n  // --- System panel -------------------------------------------------------\n  // Deliberately unauthenticated. This is an offline single-device app: nothing\n  // here leaves the machine, and in a school with no IT support a forgotten\n  // admin password would lock out the only person able to fix anything.\n  async loadDiagnostics() {\n    this.setState({ diagLoading: true });\n    try {\n      const r = await fetch(this.apiBase() + \"/api/diagnostics\");\n      if (!r.ok) throw new Error(\"HTTP \" + r.status);\n      this.setState({ diag: await r.json(), diagErr: null, diagLoading: false });\n    } catch (e) {\n      // No backend (static demo build) — say so plainly rather than hanging.\n      this.setState({ diag: null, diagErr: String(e.message || e), diagLoading: false });\n    }\n  }\n\n  async exportData() {\n    // Straight browser download rather than fetch+blob: the file can be large\n    // once uploads are included, and a hidden anchor keeps the app state intact\n    // instead of navigating away from the running session.\n    try {\n      const a = document.createElement(\"a\");\n      a.href = this.apiBase() + \"/api/export\";\n      a.download = \"\";\n      document.body.appendChild(a);\n      a.click();\n      document.body.removeChild(a);\n    } catch (e) {}\n  }\n\n  copyDiagnostics() {\n    const d = this.state.diag;\n    const text = d\n      ? JSON.stringify(d, null, 2)\n      : \"Resilient EdTech — no backend reachable at \" + this.apiBase();\n    try {\n      navigator.clipboard.writeText(text);\n      this.setState({ diagCopied: true });\n      setTimeout(() => this.setState({ diagCopied: false }), 2000);\n    } catch (e) {}\n  }\n\n  // Gov-portal accessibility text sizing (A- / A / A+) — scales the whole app.\n  setFontScale(dir) {\n    let pct = Number(this.state.fontPct || 100);\n    if (dir === 0) pct = 100;\n    else pct = Math.max(85, Math.min(130, pct + dir * 7.5));\n    this.setState({ fontPct: pct });\n    try { localStorage.setItem(\"ret_font_pct\", String(pct)); } catch (e) {}\n    const root = document.documentElement;\n    if (root) root.style.fontSize = pct + \"%\";\n  }\n\n  componentDidMount() {\n    try { const m = localStorage.getItem(this.MEMORY_KEY); if (m !== null) this.setState({ memoryOn: m === \"1\" }); } catch (e) {}\n    try { const fp = parseFloat(localStorage.getItem(\"ret_font_pct\") || \"100\"); if (fp && fp !== 100) { this.setState({ fontPct: fp }); document.documentElement.style.fontSize = fp + \"%\"; } } catch (e) {}\n    try { const t = parseInt(localStorage.getItem(this.TEACHER_KEY) || \"1\", 10); if (t) this.state.teacherId = t; } catch (e) {}\n    this.refreshTeachers().then(() => { this.refreshRecent(); this.loadReflection(); });\n    this.loadModel();  }\n\n  // --- On-device model picker + engine state -------------------------------\n  // The header must tell the truth about which engine is actually running. If\n  // Ollama isn't up, a teacher otherwise gets rule-based plans with no visible\n  // reason, and the model dropdown silently does nothing when changed.\n  async loadModel() {\n    try {\n      const r = await fetch(this.apiBase() + \"/api/engine/model\");\n      if (r.ok) {\n        const d = await r.json();\n        if (d && d.choices && d.choices.length) {\n          this.setState({ modelChoices: d.choices, modelValue: d.model });\n        }\n      }\n    } catch (e) {}\n    try {\n      const e2 = await fetch(this.apiBase() + \"/api/engine\");\n      if (e2.ok) {\n        const st = await e2.json();\n        const loc = st.local || {};\n        this.setState({\n          engineLive: st.resolved === \"local\" && !!loc.model_ready,\n          engineKnown: true,\n        });\n      }\n    } catch (e) {\n      // No backend at all (static demo build) — leave engineKnown false so the\n      // pill keeps its neutral offline wording rather than claiming a state.\n    }\n  }\n\n  // Where the reviewer installer lives. Three sources, in order, because the\n  // deployed bundle has no Tweaks panel to supply a prop:\n  //   1. the downloadUrl prop      (editing here in the design tool)\n  //   2. ?dl=<url> in the address  (share a link without redeploying)\n  //   3. <meta name=\"ret-installer-url\">  (set once in the served page)\n  // Returns \"\" when none is set, which hides the button.\n  DEFAULT_INSTALLER_URL =\n    \"https://github.com/christye6782-ai/resilient-edtech-backend/releases/download/v1.0.0/ResilientEdTech-Setup.exe\";\n\n  installerUrl() {\n    const fromProp = (this.props.downloadUrl || \"\").trim();\n    if (fromProp) return fromProp;\n    try {\n      const q = new URLSearchParams(window.location.search).get(\"dl\");\n      if (q && q.trim()) return q.trim();\n    } catch (e) {}\n    try {\n      const m = document.querySelector('meta[name=\"ret-installer-url\"]');\n      const c = m && (m.getAttribute(\"content\") || \"\").trim();\n      if (c) return c;\n    } catch (e) {}\n    return this.DEFAULT_INSTALLER_URL;\n  }\n\n  async onModelChange(e) {\n    const model = e.target.value;\n    this.setState({ modelValue: model });\n    try {\n      await fetch(this.apiBase() + \"/api/engine/model\", {\n        method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: JSON.stringify({ model }),\n      });\n    } catch (err) {}\n  }\n\n  // --- Teacher profiles (shared-device, no password) ---\n  async refreshTeachers() {\n    try {\n      const r = await fetch(this.apiBase() + \"/api/teachers\");\n      if (!r.ok) throw new Error(\"teachers \" + r.status);\n      const data = await r.json();\n      const teachers = (data.teachers && data.teachers.length) ? data.teachers : [{ id: 1, name: \"Teacher\" }];\n      const valid = teachers.some(t => t.id === this.state.teacherId);\n      this.setState({ teachers, teacherId: valid ? this.state.teacherId : teachers[0].id });\n    } catch (e) {\n      // Offline fallback — profiles cached on-device.\n      let teachers = [{ id: 1, name: \"Teacher\" }];\n      try { const raw = localStorage.getItem(this.TEACHERS_KEY); if (raw) teachers = JSON.parse(raw); } catch (e2) {}\n      const valid = teachers.some(t => t.id === this.state.teacherId);\n      this.setState({ teachers, teacherId: valid ? this.state.teacherId : teachers[0].id });\n    }\n  }\n  persistTeachersLocal(list) { try { localStorage.setItem(this.TEACHERS_KEY, JSON.stringify(list)); } catch (e) {} }\n\n  switchTeacher(id) {\n    if (id === this.state.teacherId) { this.setState({ showProfiles: false }); return; }\n    try { localStorage.setItem(this.TEACHER_KEY, String(id)); } catch (e) {}\n    // Reset the current form so one teacher's inputs don't bleed into another's.\n    this.setState({ teacherId: id, showProfiles: false, recent: [], memoryPrefilled: false, showResults: false, reflection: null, profile: null, suggestion: null, suggestionDismissed: false, suggestionApplied: false, fbPlanId: null, fbRating: 0, fbTools: {}, fbNotes: \"\", fbSaved: false }, () => { this.refreshRecent(); this.loadReflection(); });\n  }\n\n  async addTeacher() {\n    const name = (this.state.newProfileName || \"\").trim();\n    if (!name) return;\n    let created = null;\n    try {\n      const r = await fetch(this.apiBase() + \"/api/teachers\", { method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: JSON.stringify({ name }) });\n      if (r.ok) created = await r.json();\n    } catch (e) {}\n    if (!created) {\n      // Offline fallback — synthesise an id and cache locally.\n      const maxId = this.state.teachers.reduce((m, t) => Math.max(m, t.id), 0);\n      created = { id: maxId + 1, name };\n      const list = [...this.state.teachers, created];\n      this.persistTeachersLocal(list);\n      this.setState({ teachers: list });\n    } else {\n      await this.refreshTeachers();\n    }\n    this.setState({ addingProfile: false, newProfileName: \"\" });\n    this.switchTeacher(created.id);\n  }\n\n  async deleteTeacher(id, e) {\n    if (e && e.stopPropagation) e.stopPropagation();\n    if (id === 1) return;\n    try { await fetch(this.apiBase() + \"/api/teachers/\" + id, { method: \"DELETE\" }); } catch (err) {}\n    const list = this.state.teachers.filter(t => t.id !== id);\n    this.persistTeachersLocal(list);\n    const fallbackId = this.state.teacherId === id ? 1 : this.state.teacherId;\n    this.setState({ teachers: list.length ? list : [{ id: 1, name: \"Teacher\" }] });\n    if (this.state.teacherId === id) this.switchTeacher(fallbackId);\n  }\n\n  setMemoryOn(on) {\n    try { localStorage.setItem(this.MEMORY_KEY, on ? \"1\" : \"0\"); } catch (e) {}\n    this.setState({ memoryOn: on }, () => { if (on) this.applyMemoryPrefill(true); });\n  }\n\n  // Build a compact digest of this teacher's recent lessons — the \"memory\".\n  // Constraints that recur, tools reused across lessons, and recent subjects.\n  buildTeacherContext() {\n    const recent = (this.state.recent || []).slice(0, 5);\n    if (!recent.length) return null;\n    const tally = (arr) => { const m = {}; arr.forEach(v => { const k = (v || \"\").trim(); if (k) m[k] = (m[k] || 0) + 1; }); return m; };\n    const top = (m, min) => Object.entries(m).filter(([, n]) => n >= (min || 1)).sort((a, b) => b[1] - a[1]).map(([k]) => k);\n    const cons = tally([].concat(...recent.map(r => r.constraintLabels || [])));\n    const tools = tally([].concat(...recent.map(r => r.tools || [])));\n    const subjects = top(tally(recent.map(r => r.subject)), 1).slice(0, 3);\n    const commonConstraints = top(cons, recent.length >= 2 ? 2 : 1).slice(0, 4);\n    const reusedTools = top(tools, 2).slice(0, 4);\n    const lessonsUsed = recent.length;\n    return { lessonsUsed, constraints: commonConstraints, tools: reusedTools, subjects, lastSubject: recent[0].subject || \"\", lastForm: recent[0].form || \"\", lastConstraints: recent[0].constraintLabels || [] };\n  }\n\n  teacherContextDigest() {\n    const c = this.buildTeacherContext();\n    if (!c) return \"\";\n    const parts = [];\n    parts.push(\"Based on this teacher's last \" + c.lessonsUsed + \" lesson(s).\");\n    if (c.subjects.length) parts.push(\"Usually teaches: \" + c.subjects.join(\", \") + \".\");\n    if (c.constraints.length) parts.push(\"Recurring classroom constraints: \" + c.constraints.join(\"; \") + \".\");\n    if (c.tools.length) parts.push(\"Tools this teacher already uses and knows: \" + c.tools.join(\", \") + \" — prefer these where suitable.\");\n    return parts.join(\" \");\n  }\n\n  // Prefill the stable facts (subject/form + last constraints) from history so the\n  // teacher doesn't re-enter them. Never clobbers what the teacher already typed.\n  applyMemoryPrefill(force) {\n    if (!this.state.memoryOn) return;\n    const c = this.buildTeacherContext();\n    if (!c) return;\n    this.setState(st => {\n      const patch = {};\n      if ((force || !st.subjectInput) && c.lastSubject) patch.subjectInput = c.lastSubject;\n      if ((force || !st.formInput) && c.lastForm) patch.formInput = c.lastForm;\n      const anyConstraint = Object.values(st.constraints).some(Boolean);\n      if ((force || !anyConstraint) && c.lastConstraints.length) {\n        const next = { ...st.constraints };\n        this.constraintDefs.forEach(d => { next[d.key] = c.lastConstraints.includes(d.en); });\n        patch.constraints = next;\n      }\n      patch.memoryPrefilled = true;\n      return patch;\n    });\n  }\n\n  // Load history: prefer the backend (SQLite, persists across restarts);\n  // fall back to on-device localStorage when no backend is reachable.\n  async refreshRecent() {\n    try {\n      const r = await fetch(this.apiBase() + \"/api/plans?limit=12&teacher_id=\" + this.state.teacherId);\n      if (!r.ok) throw new Error(\"plans \" + r.status);\n      const data = await r.json();\n      const recent = (data.plans || []).map(p => ({\n        id: p.id, serverId: p.id, origin: \"api\",\n        title: p.title || \"\", subject: p.subject || \"\", form: p.form || \"\", topic: p.topic || \"\",\n        score: p.score || 0, lang: p.lang || \"en\", dataSource: p.data_source || \"live\",\n        constraintLabels: p.constraints || [], tools: p.tools || [],\n        savedAt: p.created_at,\n      }));\n      this.setState({ recent, plansBackend: true }, () => this.applyMemoryPrefill(false));\n    } catch (e) {\n      this.setState({ recent: this.loadRecent(), plansBackend: false }, () => this.applyMemoryPrefill(false));\n    }\n  }\n\n  STR = {\n    en: {\n      tagline: \"A teacher's companion for tech-rich lessons that work anywhere\",\n      govStrip: \"An offline education initiative · Ministry of Education aligned\",\n      textSize: \"Text size\",\n      offline: \"Offline in the installed app\",\n      offlineAi: \"Offline · AI model\",\n      offlineBasic: \"Offline · rule-based\",\n      heroEyebrow: \"For teachers in rural & remote schools\",\n      heroTitle: \"Tech-rich lessons that work in your classroom.\",\n      heroText: \"Start with the lesson you've already written. It comes back checked against the curriculum, rebuilt around your real classroom limits, and with every tool explained simply. One device, no internet, no cost.\",\n      heroCta: \"Start with my lesson plan\",\n      heroAligned: \"Aligned to DSKP · scheme of work · textbook\",\n      agentsTitle: \"Three assistants, one workflow\",\n      a1t: \"Curriculum Checker\", a1d: \"Scores how well your plan fits the curriculum and finds the gaps.\",\n      a2t: \"Lesson Rebuilder\", a2d: \"Rebuilds the lesson around your constraints — keeping the technology.\",\n      a3t: \"Tool Helper\", a3d: \"Explains any unfamiliar tool, step by step, for low-resource rooms.\",\n      tabInput: \"1 · Plan Input\", tabAnalysis: \"2 · Analysis\", tabPlan: \"3 · Revised Plan\", tabFaq: \"Tool Helper\",\n      tabSystem: \"System\",\n      tabProfile: \"My Profile\",\n      sysTitle: \"System status\",\n      sysText: \"Everything the app needs to run, and where it stands right now. Useful when something isn't working as expected.\",\n      sysRefresh: \"Refresh\",\n      sysCopy: \"Copy diagnostics\",\n      sysExport: \"Export my data\",\n      subjEnglish: \"English\", subjMath: \"Mathematics\", subjScience: \"Science\",\n      ragTitle: \"Curriculum index\",\n      ragText: \"The curriculum ships with the app, but it has to be indexed on this computer before plans can be checked against it.\",\n      ragChunks: \"indexed\",\n      ragBuild: \"Build curriculum index\",\n      ragBuilding: \"Indexing… this can take a few minutes. You can keep working.\",\n      ragBuilt: \"Curriculum indexed — {n} passages. Plans are now checked against the DSKP.\",\n      ragFailed: \"Could not index. Check that the AI model is installed in the System panel above.\",\n      ragEmptyWarn: \"Nothing is indexed yet, so plans are being written without curriculum grounding. Build the index below.\",\n      ragNotReadyWarn: \"The AI model needed for indexing isn't available, so the curriculum cannot be indexed on this computer. Plans still work, but without DSKP grounding.\",\n      sysBack: \"Back to my lesson\",\n      sysRebuild: \"Rebuild my profile\",\n      sysRebuilt: \"Profile rebuilt from your saved lessons and feedback\",\n      sysRebuildHint: \"Use this if your teaching profile looks out of date — for example after deleting lessons.\",\n      choosePh: \"Choose…\",\n      groundingHint: \"No offline curriculum for this subject yet — your plan is still rebuilt, but without DSKP grounding.\",\n      sysExportHint: \"Saves every plan, profile and piece of feedback as one zip. Nothing backs up this computer — keep a copy elsewhere.\",\n      sysCopied: \"Copied\",\n      sysNone: \"No backend reachable — this is the interface demo, so lesson output is sample data.\",\n      step1Title: \"Bring in your lesson plan\", step1Help: \"Snap a photo of a handwritten plan, or drop in a PDF, Word or text file. The vision model reads it for you.\",\n      dzClick: \"Click to choose\", dzOr: \" or drag a file here\", dzHint: \"Handwritten photo, scan, PDF, DOCX or TXT · up to 15 MB\",\n      extractNote: \"Read sample_lesson_plan.txt via direct text · 121 words · review below, then continue.\",\n      subject: \"Subject\", grade: \"Grade / Year\", topic: \"Topic\", subjectPh: \"e.g. English\", gradePh: \"e.g. Year 5\", topicPh: \"e.g. Days (Everyday Life & Routines)\", lessonLabel: \"Lesson plan text\", lessonHint: \"— auto-filled from your file, edit if needed\", lessonPlaceholder: \"Paste or type your lesson plan here…\",\n      step2Title: \"What does your classroom have to work around?\", step2Help: \"Tap everything that applies — the plan adapts to exactly these conditions.\",\n      ofSelected: \"of {n} constraints selected.\",\n      runIdle: \"Analyse & rebuild my plan\", runBusy: \"Working through your plan…\", runRerun: \"Re-run analysis\",\n      skAnalysis: \"Checking your plan against the curriculum…\", skPlan: \"Rebuilding your lesson around your constraints…\",\n      skHint: \"In the installed app this can take up to a minute on a modest device, running entirely on that machine.\",\n      progTitle: \"Working on your lesson\",\n      progStage1: \"Checking your plan against the DSKP\",\n      progStage2: \"Rebuilding it for your classroom conditions\",\n      progStage3: \"Checking the rebuilt plan for gaps\",\n      progNote: \"Everything runs on this computer, so it takes longer than a cloud service would. You can leave this open.\",\n      progSlow: \"Still working. On an older computer a full run can take several minutes — nothing has gone wrong.\",\n      errNetworkTitle: \"Couldn't reach the assistant\",\n      errNetworkBody: \"The local service isn't responding, so we've shown a sample plan instead. Check that the app's server is running, then re-run.\",\n      errServerTitle: \"The assistant hit a problem\",\n      errServerBody: \"Your lesson couldn't be processed this time, so we've shown a sample plan instead. Try re-running — if it keeps failing, restart the app.\",\n      errUnexpectedTitle: \"Something went wrong\",\n      errUnexpectedBody: \"The run stopped unexpectedly. Nothing was saved — please try again.\",\n      errDismiss: \"Dismiss\",\n      skipLink: \"Skip to main content\",\n      tabsLabel: \"Lesson planning steps\",\n      doneAnnounce: \"Your revised plan is ready.\",\n      errAnnounce: \"The run finished with a problem. See the message on screen.\",\n      aFontSmaller: \"Decrease text size\", aFontNormal: \"Reset text size\", aFontLarger: \"Increase text size\",\n      runHint: \"First we check your plan against the curriculum, then rebuild it to work in your classroom.\",\n      srcLive: \"Live results · analysed by your local AI\", srcDemo: \"Demo data · no backend connected\",\n      emptyAnalysisTitle: \"No analysis yet\",\n      emptyAnalysis: \"Add your lesson on the Plan Input tab and run it — you'll see how it scores against the curriculum and exactly which gaps to close.\",\n      emptyPlanTitle: \"No plan yet\",\n      emptyPlan: \"Once you run the analysis, your rebuilt, ready-to-teach plan appears here — adapted to your classroom and printable as an ERPH form.\",\n      emptyCta: \"Go to Plan Input\",\n      emptyRecentTitle: \"Your saved plans will appear here\
