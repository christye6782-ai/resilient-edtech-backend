\\nActivities:\\n1. Induction (5 min): a short video of a hectic morning routine; pupils write 2 keywords.\\n2. Step 1 — Deep inquiry (20 min): in groups, pupils analyse a text about a child's school day abroad and build a mind map linking Activities → Time → Adverbs of Frequency.\\n3. Step 2 — HOTS creative task (25 min): pupils design a 'My Perfect Day' timeline infographic using adverbs of frequency.\\n\\nICT: PowerPoint slides, YouTube (daily-routines clip), Wordwall.\\nClosure: pupils summarise their own learning and submit a HOTS exit ticket.\\nMaterials: digital slides, printed reading cards, mini whiteboards, Year 5 English (CEFR) textbook.\",\n      analyst: {\n        score: 68,\n        summary: \"A tech-rich Year 5 English lesson on daily routines with strong higher-order inquiry and a creative timeline task — but the digital tools it names (YouTube and Wordwall) both need the internet and assume pupils have devices. Two swaps keep the technology while letting the whole lesson run offline on one shared device.\",\n        alignments: [\n          { dimension: \"DSKP Content Standard\", status: \"aligned\", statusLabel: \"Aligned\", notes: \"Covers 1.2 & 2.1 for Year 5 English (CEFR-aligned).\" },\n          { dimension: \"Learning Standard\", status: \"partial\", statusLabel: \"Partial\", notes: \"SP 1.2.2, 2.1.1 & 2.1.5 addressed, but speaking (2.1.5) is never assessed.\" },\n          { dimension: \"Scheme of Work\", status: \"aligned\", statusLabel: \"On pace\", notes: \"Matches the Topic 2 (Days) placement.\" },\n          { dimension: \"Textbook\", status: \"aligned\", statusLabel: \"Matched\", notes: \"Anchored on Year 5 CEFR-aligned materials as intended.\" },\n          { dimension: \"ICT Integration\", status: \"partial\", statusLabel: \"Online-only\", notes: \"YouTube & Wordwall listed — but both require internet, a real risk here.\" },\n          { dimension: \"Inquiry / 21st-c skills\", status: \"aligned\", statusLabel: \"Strong\", notes: \"Solid comparative inquiry and a creative timeline task.\" },\n        ],\n        gaps: [\"YouTube and Wordwall both need internet — neither will run in a no-connection classroom.\", \"Speaking standard 2.1.5 (describe using suitable statements) is planned but not assessed.\", \"Wordwall assumes pupils have devices; on one shared device the vocab game stalls.\"],\n        recommendations: [\"Swap the live YouTube clip for a pre-downloaded video played from the teacher device (offline).\", \"Replace the Wordwall game with printed vocabulary cards or a projected offline word game.\", \"Add a short peer-sharing rubric so speaking standard 2.1.5 is assessed as pupils present their timeline.\"],\n        standards: [\"DSKP 1.2\", \"DSKP 2.1\", \"LS 1.2.2\", \"LS 2.1.5\"],\n      },\n      plan: {\n        title: \"Everyday Life & Routines — a resilient, tech-integrated Year 5 English lesson\",\n        subject: \"English\", form: \"Year 5\", topic: \"Days — everyday life & routines\", duration: \"60 min\",\n        objectives: [\"Analyse a daily schedule by matching at least four activities to their correct times in a text.\", \"Evaluate time-management habits by comparing their own routine with a peer's.\", \"Create a personalised, creative one-day timeline that presents their daily routine.\"],\n        success_criteria: [\"I can pick out specific times and activities from a short text or audio.\", \"I can use adverbs of frequency (usually, sometimes, never) in clear, logical sentences.\", \"I produce a visually structured creative daily timeline.\"],\n        tools: [\"Wordwall (offline set)\", \"YouTube (offline clip)\", \"PowerPoint slides\"],\n        constraint_solutions: [\n          { constraint: \"No internet\", strategy: \"Download the YouTube clip and export the Wordwall game as printable cards the night before; play the video and run the game from the teacher device or on paper — no connection needed.\" },\n          { constraint: \"One device only\", strategy: \"Use the single device + projector for the video and slides, then run the vocabulary game as printed cards the whole class shares — no pupil devices required.\" },\n          { constraint: \"No electricity\", strategy: \"Charge the device beforehand; a 60-minute lesson runs on one charge, and the printed reading cards and timeline task need no power at all.\" },\n        ],\n        phases: [\n          { phase: \"Set Induction\", duration: \"5 min\", activity: \"Play a short pre-downloaded clip of a hectic morning routine; ask 'what happens if we don't plan our days?' Pupils write two keywords on mini-whiteboards.\", technology: \"Teacher device + projector, offline video.\" },\n          { phase: \"Step 1 — Deep Inquiry\", duration: \"20 min\", activity: \"In groups of four, pupils analyse a short text about a child's school day abroad, extract times and activities, and build a comparative mind map (Activities → Time → Adverbs of Frequency); the teacher facilitates.\", technology: \"PowerPoint prompt slide projected offline; printed reading cards.\" },\n          { phase: \"Step 2 — HOTS Creative Task\", duration: \"25 min\", activity: \"Individually or in pairs, pupils design a 'My Perfect Day' timeline infographic or journal entry using adverbs of frequency, choosing their own format.\", technology: \"Paper / mini-whiteboards; optional exemplar projected from the offline device.\" },\n          { phase: \"Closure\", duration: \"10 min\", activity: \"Pupils summarise their own learning and submit an exit ticket with one HOTS question about productivity.\", technology: \"Printed exit-ticket slips — no devices needed.\" },\n        ],\n        assessment: \"PBD — CEFR A2 Low (Band 4–5). Evidence: the daily-timeline portfolio and a peer-sharing session — assess command of adverbs of frequency, logical sentence sequencing and reasoning, not rote accuracy.\",\n        materials: [\"Teacher device (phone or laptop)\", \"Projector or TV\", \"Pre-downloaded routines video + PowerPoint on USB\", \"Printed reading-text cards (1 per group)\", \"Mini whiteboards / A4 paper & coloured markers\", \"Year 5 English textbook (CEFR-aligned)\"],\n        alignment_note: \"Every original DSKP content and learning standard is kept — only the delivery changes. The online tools become offline equivalents so the whole lesson runs on one device with no internet, closing the resilience gap the Analyst flagged.\",\n        tema: \"World of Self, Family & Friends\",\n        curriculum_sources: [\n          { year: 5, section: \"Reading\", codes: [\"1.2\", \"1.2.2\"], snippet: \"Understand a variety of linear and non-linear texts by identifying specific information such as times, days and activities in a schedule.\", score: 0.82 },\n          { year: 5, section: \"Speaking\", codes: [\"2.1\", \"2.1.5\"], snippet: \"Explain and describe main ideas and details, using suitable statements to present a familiar topic such as a personal daily routine.\", score: 0.79 },\n          { year: 5, section: \"Writing\", codes: [\"3.2\"], snippet: \"Communicate and organise information coherently, producing a short, structured piece such as a personal timeline using appropriate connectors.\", score: 0.74 },\n        ],\n        kbat_level: \"Evaluating & Creating / Menilai & Mencipta\",\n        kbat: [\"If you could change one thing about your school timetable to make learning more fun, what would it be and why?\", \"Design a symbol or icon system to teach time management and daily routines to a Year 1 pupil.\"],\n        pbd: \"Target CEFR A2 Low (Band 4–5). Evidence: the pupils' timeline portfolio plus the peer-sharing session. Value command of adverbs of frequency, logical sequencing and critical reasoning over rote accuracy.\",\n        erph_langkah2: { duration: \"25 min\", activity: \"Individually or in pairs, pupils design a 'My Perfect Day' creative timeline infographic or journal entry, incorporating adverbs of frequency and choosing their own medium (a sketch or a mini role-play script). The teacher guides with challenging prompts to deepen vocabulary.\", technology: \"Paper or mini-whiteboards; an optional worked exemplar projected from the offline device.\" },\n        penutup: \"Pupils summarise their own learning — ask 'who can explain how to talk about your day to a friend who missed class?' Then each pupil submits an exit ticket with one HOTS question about productivity for the next session.\",\n      },\n      faqDB: {\n        wordwall: { term: \"Wordwall (offline set)\", explanation: \"Wordwall builds interactive vocabulary games (match-ups, quizzes, group-sorts). It normally runs online in a browser, but any activity can be printed as flashcards or match cards to use with no internet.\", steps: [\"Create the activity where internet is available.\", \"Use the 'Print' option to export it as cards or a worksheet.\", \"Copy any projected version to the teacher device as backup.\", \"Play it on paper in class, or project it from the offline device.\"], lowResource: \"Printed cards need no devices or internet; ideal for group vocabulary practice.\", alternatives: [\"Printed flashcards\", \"Hand-drawn match cards\", \"A board word-game led by the teacher\"] },\n        youtube: { term: \"YouTube (offline clip)\", explanation: \"Short video clips that illustrate a concept. Because streaming needs internet, download the clip in advance and play it from the teacher device — pupils watch on the projector.\", steps: [\"Find the clip where internet is available.\", \"Download it (or use a school-approved offline copy) to the teacher device.\", \"Copy it to a USB stick as a backup.\", \"Play it locally from the projector in class — no connection needed.\"], lowResource: \"Plays from the teacher device with no internet; one screen serves the whole class.\", alternatives: [\"A printed storyboard of key frames\", \"A teacher demonstration\", \"Textbook images with guided questions\"] },\n        powerpoint: { term: \"PowerPoint slides\", explanation: \"Presentation slides shown on a projector. They run entirely offline from the teacher device, making them one of the most reliable tools for a no-internet classroom.\", steps: [\"Prepare the slides where convenient.\", \"Copy the file to the teacher device (and a USB backup).\", \"Open it in PowerPoint or a free viewer — no internet needed.\", \"Project it and navigate with the device or a clicker.\"], lowResource: \"Fully offline on one charged device; can be printed as handouts if no projector.\", alternatives: [\"Printed slide handouts\", \"Charts drawn on the whiteboard\", \"Flashcards / support cards\"] },\n        plickers: { term: \"Plickers\", explanation: \"A free classroom-response tool where each pupil holds up a printed card. The teacher scans the whole class once with a phone camera — pupils need no device or internet.\", steps: [\"Print one Plickers card per pupil (free, reusable).\", \"Show or read a question aloud.\", \"Pupils rotate their card so their chosen letter faces up.\", \"Scan the class once with the teacher phone — results appear instantly.\"], lowResource: \"Only the teacher device needs charge; fully offline once cards are printed.\", alternatives: [\"Hand-drawn A/B/C/D cards\", \"Coloured paper per option\", \"Hands-up voting\"] },\n        googleclassroom: { term: \"Google Classroom\", explanation: \"A cloud platform for sharing assignments and feedback. It needs steady internet and pupil accounts, so in a low-connectivity school use it only to prepare materials, then distribute them offline.\", steps: [\"Prepare assignments where internet is available.\", \"Download or print the materials for class use.\", \"Hand out printed copies or share files by USB.\", \"Collect work on paper and record marks later when online.\"], lowResource: \"Not usable live offline; treat it as a prep tool and deliver on paper / USB.\", alternatives: [\"Printed worksheet packs\", \"A shared USB folder\", \"Kolibri for offline content\"] },\n        kolibri: { term: \"Kolibri\", explanation: \"Free open-source software that puts a whole library of lessons and videos on a local device or server — designed for classrooms with no internet.\", steps: [\"Install Kolibri on the teacher device or a local server once.\", \"Download the channels (subjects) you need while online.\", \"In class, pupils connect to the local Kolibri — no internet required.\", \"Assign lessons and track progress on the device.\"], lowResource: \"Purpose-built for offline; serves content over a local connection from one device.\", alternatives: [\"A USB folder of videos\", \"Downloaded PDFs on the teacher device\", \"Printed materials\"] },\n        canva: { term: \"Canva for Education\", explanation: \"An online design tool for posters, slides and worksheets. Designing needs internet, but finished pieces can be downloaded or printed to use fully offline.\", steps: [\"Design the poster or worksheet where internet is available.\", \"Download it as a PDF or image.\", \"Copy it to the teacher device or print copies.\", \"Use the printed or projected version in class — no connection needed.\"], lowResource: \"Create online, deliver offline — export to PDF and print or project.\", alternatives: [\"Hand-made charts\", \"PowerPoint handouts\", \"Printed templates\"] },\n        quizizz: { term: \"Quizizz Paper Mode\", explanation: \"A quiz mode where pupils answer on a printed paper card instead of a device. The teacher scans answers with one phone — a normally-online quiz works with no pupil internet.\", steps: [\"Build a quiz and switch on Paper Mode.\", \"Print the answer cards for your class.\", \"Run the quiz, scanning cards with the teacher device.\", \"Review the instant report to see who needs help.\"], lowResource: \"Pupils need no device or internet; only the teacher device is used.\", alternatives: [\"Plickers\", \"Printed self-marking worksheet\", \"Mini whiteboards\"] },\n        kahoot: { term: \"Kahoot\", explanation: \"A game-based quiz shown on a shared screen. It normally needs internet and pupil devices, so for low-resource rooms run it offline as a projected team quiz.\", steps: [\"Prepare the questions in advance (or print them).\", \"Show one question at a time on the projector.\", \"Teams discuss and hold up an answer card (A/B/C/D).\", \"Reveal the answer and keep a simple team score on the board.\"], lowResource: \"Runs offline as a projected team game; only the teacher device is needed.\", alternatives: [\"Quizizz Paper Mode\", \"Plickers\", \"Team quiz with answer cards\"] },\n        phet: { term: \"PhET Simulations (offline)\", explanation: \"Free interactive science & maths simulations. The library can be downloaded and run from a USB stick or local folder with no internet.\", steps: [\"Download the PhET offline bundle once where internet is available.\", \"Copy it to a USB stick or the teacher device.\", \"Open a simulation in any browser — no connection required.\", \"Project it or pass the device between groups.\"], lowResource: \"Runs from USB on one charged device; ideal for one-screen, no-internet rooms.\", alternatives: [\"Printed simulation screenshots\", \"A physical model\", \"Textbook diagrams with questions\"] },\n      },\n    },\n    ms: {\n      sampleLesson: \"Subjek: Bahasa Inggeris — Tahun 5 (5 Effective)\\nTema: World of Self, Family and Friends\\nTopic 2: Days (Everyday Life & Routines)\\n\\nStandard Kandungan (SK):\\n1.2 Understand meaning in a variety of familiar contexts\\n2.1 Communicate simple information intelligibly\\nStandard Pembelajaran (SP):\\n1.2.2 Understand with support specific information and details of longer simple texts on familiar topics.\\n2.1.1 Give detailed information about themselves.\\n2.1.5 Describe people, places and objects using suitable statements.\\n\\nObjektif pembelajaran: Di akhir sesi, murid dapat menganalisis butiran jadual harian (memadankan sekurang-kurangnya 4 aktiviti dengan waktunya), menilai tabiat pengurusan masa berbanding rakan, dan mencipta persembahan garis masa satu hari yang kreatif.\\n\\nAktiviti:\\n1. Set Induksi (5 minit): klip video rutin pagi yang sibuk; murid menulis 2 kata kunci.\\n2. Langkah 1 — Inkuiri mendalam (20 minit): dalam kumpulan, murid menganalisis teks tentang jadual sekolah kanak-kanak di negara lain dan membina peta minda Aktiviti → Waktu → Adverbs of Frequency.\\n3. Langkah 2 — Tugasan KBAT kreatif (25 minit): murid mereka infografik garis masa 'My Perfect Day' menggunakan adverbs of frequency.\\n\\nTMK: Slaid PowerPoint, YouTube (klip rutin harian), Wordwall.\\nPenutup: murid merumus pembelajaran sendiri dan menyerahkan tiket keluar KBAT.\\nBBM: slaid digital, kad teks bacaan, papan putih mini, buku teks Bahasa Inggeris Tahun 5 (CEFR).\",\n      analyst: {\n        score: 68,\n        summary: \"Pelajaran Bahasa Inggeris Tahun 5 tentang rutin harian yang kaya teknologi dengan inkuiri aras tinggi dan tugasan garis masa kreatif — tetapi alat digital yang disenaraikan (YouTube dan Wordwall) memerlukan internet dan menganggap murid ada peranti. Dua pertukaran mengekalkan teknologi sambil membolehkan seluruh pelajaran berjalan luar talian pada satu peranti dikongsi.\",\n        alignments: [\n          { status: \"aligned\", dimension: \"Standard Kandungan DSKP\", statusLabel: \"Sejajar\", notes: \"Merangkumi 1.2 & 2.1 bagi Bahasa Inggeris Tahun 5 (selaras CEFR).\" },\n          { status: \"partial\", dimension: \"Standard Pembelajaran\", statusLabel: \"Separa\", notes: \"SP 1.2.2, 2.1.1 & 2.1.5 disentuh, tetapi pertuturan (2.1.5) tidak ditaksir.\" },\n          { status: \"aligned\", dimension: \"Rancangan Pengajaran Tahunan\", statusLabel: \"Ikut jadual\", notes: \"Sepadan dengan penempatan Topic 2 (Days).\" },\n          { status: \"aligned\", dimension: \"Buku Teks\", statusLabel: \"Sepadan\", notes: \"Berpaksikan bahan Tahun 5 selaras CEFR seperti dirancang.\" },\n          { status: \"partial\", dimension: \"Integrasi ICT\", statusLabel: \"Perlu internet\", notes: \"YouTube & Wordwall disenaraikan — tetapi kedua-duanya perlukan internet, satu risiko di sini.\" },\n          { status: \"aligned\", dimension: \"Inkuiri / kemahiran abad ke-21\", statusLabel: \"Kukuh\", notes: \"Inkuiri perbandingan yang mantap dan tugasan garis masa kreatif.\" },\n        ],\n        gaps: [\"YouTube dan Wordwall kedua-duanya perlukan internet — tiada yang berfungsi di bilik darjah tanpa sambungan.\", \"Standard pertuturan 2.1.5 (memerihal menggunakan ayat sesuai) dirancang tetapi tidak ditaksir.\", \"Wordwall menganggap murid ada peranti; pada satu peranti dikongsi, permainan kosa kata tergendala.\"],\n        recommendations: [\"Tukar klip YouTube langsung kepada video yang dimuat turun awal dan dimainkan dari peranti guru (luar talian).\", \"Ganti permainan Wordwall dengan kad kosa kata bercetak atau permainan perkataan luar talian yang ditayangkan.\", \"Tambah rubrik perkongsian rakan ringkas supaya standard pertuturan 2.1.5 ditaksir semasa murid membentangkan garis masa mereka.\"],\n        standards: [\"DSKP 1.2\", \"DSKP 2.1\", \"SP 1.2.2\", \"SP 2.1.5\"],\n      },\n      plan: {\n        title: \"Everyday Life & Routines — pelajaran Bahasa Inggeris Tahun 5 berdaya tahan, bersepadu teknologi\",\n        subject: \"Bahasa Inggeris\", form: \"Tahun 5\", topic: \"Days — rutin & kehidupan harian\", duration: \"60 minit\",\n        objectives: [\"Menganalisis jadual harian dengan memadankan sekurang-kurangnya empat aktiviti dengan waktu yang betul dalam teks.\", \"Menilai tabiat pengurusan masa dengan membandingkan rutin sendiri dengan rakan.\", \"Mencipta garis masa satu hari yang kreatif dan peribadi yang mempersembahkan rutin harian mereka.\"],\n        success_criteria: [\"Saya boleh mengesan waktu dan aktiviti tertentu daripada teks atau audio pendek.\", \"Saya boleh menggunakan adverbs of frequency (usually, sometimes, never) dalam ayat yang jelas dan logik.\", \"Saya menghasilkan garis masa harian kreatif yang tersusun secara visual.\"],\n        tools: [\"Wordwall (set luar talian)\", \"YouTube (klip luar talian)\", \"Slaid PowerPoint\"],\n        constraint_solutions: [\n          { constraint: \"Tiada internet\", strategy: \"Muat turun klip YouTube dan eksport permainan Wordwall sebagai kad boleh cetak pada malam sebelumnya; mainkan video dan jalankan permainan dari peranti guru atau atas kertas — tanpa sambungan.\" },\n          { constraint: \"Satu peranti sahaja\", strategy: \"Gunakan satu peranti + projektor untuk video dan slaid, kemudian jalankan permainan kosa kata sebagai kad bercetak yang dikongsi seluruh kelas — tanpa peranti murid.\" },\n          { constraint: \"Tiada elektrik\", strategy: \"Cas peranti terlebih dahulu; pelajaran 60 minit berjalan dengan satu cas, dan kad bacaan bercetak serta tugasan garis masa langsung tidak memerlukan kuasa.\" },\n        ],\n        phases: [\n          { phase: \"Set Induksi\", duration: \"5 minit\", activity: \"Mainkan klip pendek rutin pagi yang sibuk yang dimuat turun awal; tanya 'apa akan berlaku jika kita tidak merancang hari kita?' Murid menulis dua kata kunci pada papan putih mini.\", technology: \"Peranti guru + projektor, video luar talian.\" },\n          { phase: \"Langkah 1 — Inkuiri Mendalam\", duration: \"20 minit\", activity: \"Dalam kumpulan empat, murid menganalisis teks pendek tentang hari persekolahan kanak-kanak di negara lain, mengekstrak waktu dan aktiviti, dan membina peta minda perbandingan (Aktiviti → Waktu → Adverbs of Frequency); guru memudah cara.\", technology: \"Slaid soalan PowerPoint ditayangkan luar talian; kad bacaan bercetak.\" },\n          { phase: \"Langkah 2 — Tugasan KBAT Kreatif\", duration: \"25 minit\", activity: \"Secara individu atau berpasangan, murid mereka infografik garis masa 'My Perfect Day' atau catatan jurnal menggunakan adverbs of frequency, memilih formatnya sendiri.\", technology: \"Kertas / papan putih mini; contoh boleh ditayangkan dari peranti luar talian.\" },\n          { phase: \"Penutup\", duration: \"10 minit\", activity: \"Murid merumus pembelajaran sendiri dan menyerahkan tiket keluar dengan satu soalan KBAT tentang produktiviti.\", technology: \"Slip tiket keluar bercetak — tanpa peranti.\" },\n        ],\n        assessment: \"PBD — CEFR A2 Low (Band 4–5). Bukti: portfolio garis masa harian dan sesi perkongsian rakan — nilai penguasaan adverbs of frequency, urutan ayat yang logik dan penaakulan, bukan ketepatan hafalan.\",\n        materials: [\"Peranti guru (telefon atau komputer riba)\", \"Projektor atau TV\", \"Video rutin + PowerPoint dimuat turun awal dalam USB\", \"Kad teks bacaan bercetak (1 setiap kumpulan)\", \"Papan putih mini / kertas A4 & pen marker berwarna\", \"Buku teks Bahasa Inggeris Tahun 5 (selaras CEFR)\"],\n        alignment_note: \"Setiap standard kandungan dan pembelajaran DSKP asal dikekalkan — hanya kaedah penyampaian berubah. Alat dalam talian menjadi setara luar talian supaya seluruh pelajaran berjalan pada satu peranti tanpa internet, menutup jurang daya tahan yang ditandakan oleh Penganalisis.\",\n        tema: \"World of Self, Family & Friends\",\n        curriculum_sources: [\n          { year: 5, section: \"Reading\", codes: [\"1.2\", \"1.2.2\"], snippet: \"Memahami pelbagai teks linear dan bukan linear dengan mengenal pasti maklumat khusus seperti masa, hari dan aktiviti dalam sesuatu jadual.\", score: 0.82 },\n          { year: 5, section: \"Speaking\", codes: [\"2.1\", \"2.1.5\"], snippet: \"Menerang dan memerihal idea utama serta butiran, menggunakan pernyataan yang sesuai untuk membentangkan topik biasa seperti rutin harian sendiri.\", score: 0.79 },\n          { year: 5, section: \"Writing\", codes: [\"3.2\"], snippet: \"Menyampai dan menyusun maklumat secara koheren, menghasilkan penulisan pendek berstruktur seperti garis masa peribadi menggunakan penanda wacana yang sesuai.\", score: 0.74 },\n        ],\n        kbat_level: \"Menilai & Mencipta\",\n        kbat: [\"Jika kamu boleh mengubah satu perkara tentang jadual waktu sekolah untuk menjadikan pembelajaran lebih menyeronokkan, apakah yang kamu ubah dan mengapa?\", \"Reka satu sistem simbol atau ikon untuk mengajar pengurusan masa dan rutin harian kepada murid Tahun 1.\"],\n        pbd: \"Sasaran CEFR A2 Low (Band 4–5). Bukti: portfolio garis masa murid serta sesi perkongsian rakan. Nilai penguasaan adverbs of frequency, urutan logik dan penaakulan kritis, bukan ketepatan hafalan.\",\n        erph_langkah2: { duration: \"25 minit\", activity: \"Secara individu atau berpasangan, murid mereka infografik garis masa 'My Perfect Day' atau catatan jurnal yang kreatif, menggabungkan adverbs of frequency dan memilih medium sendiri (lakaran atau skrip lakonan mini). Guru membimbing dengan soalan mencabar untuk memperdalam kosa kata.\", technology: \"Kertas atau papan putih mini; contoh boleh ditayangkan dari peranti luar talian.\" },\n        penutup: \"Murid merumus pembelajaran sendiri — tanya 'siapa boleh terangkan cara bercerita tentang hari anda kepada rakan yang tidak hadir?' Kemudian setiap murid menyerahkan tiket keluar dengan satu soalan KBAT tentang produktiviti untuk sesi seterusnya.\",\n      },\n      faqDB: {\n        wordwall: { term: \"Wordwall (set luar talian)\", explanation: \"Wordwall membina permainan kosa kata interaktif (padanan, kuiz, susun kumpulan). Ia biasanya berjalan dalam talian pada pelayar, tetapi mana-mana aktiviti boleh dicetak sebagai kad imbas atau kad padanan untuk digunakan tanpa internet.\", steps: [\"Cipta aktiviti di tempat yang ada internet.\", \"Guna pilihan 'Print' untuk eksport sebagai kad atau lembaran kerja.\", \"Salin versi tayangan ke peranti guru sebagai sandaran.\", \"Mainkan atas kertas di kelas, atau tayangkan dari peranti luar talian.\"], lowResource: \"Kad bercetak tidak perlukan peranti atau internet; sesuai untuk latihan kosa kata kumpulan.\", alternatives: [\"Kad imbas bercetak\", \"Kad padanan lukisan tangan\", \"Permainan perkataan di papan dipimpin guru\"] },\n        youtube: { term: \"YouTube (klip luar talian)\", explanation: \"Klip video pendek yang menerangkan sesuatu konsep. Kerana penstriman perlukan internet, muat turun klip lebih awal dan mainkannya dari peranti guru — murid menonton pada projektor.\", steps: [\"Cari klip di tempat yang ada internet.\", \"Muat turun (atau guna salinan luar talian yang diluluskan sekolah) ke peranti guru.\", \"Salin ke pemacu USB sebagai sandaran.\", \"Mainkan secara setempat dari projektor di kelas — tanpa sambungan.\"], lowResource: \"Dimainkan dari peranti guru tanpa internet; satu skrin melayani seluruh kelas.\", alternatives: [\"Papan cerita bercetak bingkai utama\", \"Demonstrasi guru\", \"Imej buku teks dengan soalan berpandu\"] },\n        powerpoint: { term: \"Slaid PowerPoint\", explanation: \"Slaid persembahan yang ditayangkan pada projektor. Ia berjalan sepenuhnya luar talian dari peranti guru, menjadikannya antara alat paling boleh diharap untuk bilik darjah tanpa internet.\", steps: [\"Sediakan slaid di tempat yang mudah.\", \"Salin fail ke peranti guru (dan sandaran USB).\", \"Buka dalam PowerPoint atau pemapar percuma — tanpa internet.\", \"Tayang dan navigasi dengan peranti atau pengeklik.\"], lowResource: \"Sepenuhnya luar talian pada satu peranti bercas; boleh dicetak sebagai edaran jika tiada projektor.\", alternatives: [\"Edaran slaid bercetak\", \"Carta dilukis di papan putih\", \"Kad imbas / kad sokongan\"] },\n        plickers: { term: \"Plickers\", explanation: \"Alat respons kelas percuma di mana setiap murid mengangkat kad bercetak. Guru mengimbas seluruh kelas sekali dengan kamera telefon — murid tidak perlukan peranti atau internet.\", steps: [\"Cetak satu kad Plickers bagi setiap murid (percuma, boleh guna semula).\", \"Paparkan atau bacakan soalan.\", \"Murid memutar kad supaya huruf pilihan menghadap atas.\", \"Imbas kelas sekali dengan telefon guru — keputusan muncul serta-merta.\"], lowResource: \"Hanya peranti guru perlu dicas; sepenuhnya luar talian setelah kad dicetak.\", alternatives: [\"Kad A/B/C/D lukisan tangan\", \"Kertas berwarna setiap pilihan\", \"Undian angkat tangan\"] },\n        googleclassroom: { term: \"Google Classroom\", explanation: \"Platform awan untuk berkongsi tugasan dan maklum balas. Ia perlukan internet stabil dan akaun murid, jadi di sekolah sambungan rendah gunakannya untuk menyediakan bahan sahaja, kemudian edarkan luar talian.\", steps: [\"Sediakan tugasan di tempat yang ada internet.\", \"Muat turun atau cetak bahan untuk kegunaan kelas.\", \"Edarkan salinan bercetak atau kongsi fail melalui USB.\", \"Kumpul kerja atas kertas dan rekod markah kemudian apabila dalam talian.\"], lowResource: \"Tidak boleh guna secara langsung luar talian; anggap sebagai alat persediaan dan sampaikan atas kertas / USB.\", alternatives: [\"Pek lembaran kerja bercetak\", \"Folder USB dikongsi\", \"Kolibri untuk kandungan luar talian\"] },\n        kolibri: { term: \"Kolibri\", explanation: \"Perisian sumber terbuka percuma yang meletakkan seluruh pustaka pelajaran dan video pada peranti atau pelayan setempat — direka untuk bilik darjah tanpa internet.\", steps: [\"Pasang Kolibri pada peranti guru atau pelayan setempat sekali.\", \"Muat turun saluran (subjek) yang diperlukan semasa dalam talian.\", \"Di kelas, murid menyambung ke Kolibri setempat — tanpa internet.\", \"Tetapkan pelajaran dan jejak kemajuan pada peranti.\"], lowResource: \"Direka khas untuk luar talian; menyampaikan kandungan melalui sambungan setempat dari satu peranti.\", alternatives: [\"Folder USB video\", \"PDF dimuat turun pada peranti guru\", \"Bahan bercetak\"] },\n        canva: { term: \"Canva for Education\", explanation: \"Alat reka bentuk dalam talian untuk poster, slaid dan lembaran kerja. Mereka bentuk perlukan internet, tetapi hasil siap boleh dimuat turun atau dicetak untuk digunakan sepenuhnya luar talian.\", steps: [\"Reka poster atau lembaran kerja di tempat yang ada internet.\", \"Muat turun sebagai PDF atau imej.\", \"Salin ke peranti guru atau cetak salinan.\", \"Guna versi bercetak atau tayangan di kelas — tanpa sambungan.\"], lowResource: \"Cipta dalam talian, sampaikan luar talian — eksport ke PDF dan cetak atau tayang.\", alternatives: [\"Carta buatan tangan\", \"Edaran PowerPoint\", \"Templat bercetak\"] },\n        quizizz: { term: \"Quizizz Mod Kertas\", explanation: \"Mod kuiz di mana murid menjawab pada kad kertas bercetak dan bukan peranti. Guru mengimbas jawapan dengan satu telefon — kuiz yang biasanya dalam talian berfungsi tanpa internet murid.\", steps: [\"Bina kuiz dan hidupkan Mod Kertas.\", \"Cetak kad jawapan untuk kelas anda.\", \"Jalankan kuiz, imbas kad dengan peranti guru.\", \"Semak laporan serta-merta untuk lihat siapa perlukan bantuan.\"], lowResource: \"Murid tidak perlukan peranti atau internet; hanya peranti guru digunakan.\", alternatives: [\"Plickers\", \"Lembaran kerja tanda sendiri bercetak\", \"Papan putih mini\"] },\n        kahoot: { term: \"Kahoot\", explanation: \"Kuiz berasaskan permainan yang dipaparkan pada skrin dikongsi. Ia biasanya perlukan internet dan peranti murid, jadi untuk bilik sumber rendah jalankannya luar talian sebagai kuiz berpasukan tayangan.\", steps: [\"Sediakan soalan lebih awal (atau cetak).\", \"Paparkan satu soalan pada satu masa di projektor.\", \"Pasukan berbincang dan mengangkat kad jawapan (A/B/C/D).\", \"Dedahkan jawapan dan simpan skor pasukan di papan.\"], lowResource: \"Berjalan luar talian sebagai permainan pasukan tayangan; hanya peranti guru diperlukan.\", alternatives: [\"Quizizz Mod Kertas\", \"Plickers\", \"Kuiz pasukan dengan kad jawapan\"] },\n        phet: { term: \"Simulasi PhET (luar talian)\", explanation: \"Simulasi sains & matematik interaktif percuma. Pustaka boleh dimuat turun dan dijalankan dari pemacu USB atau folder setempat tanpa internet.\", steps: [\"Muat turun pakej luar talian PhET sekali di tempat yang ada internet.\", \"Salin ke pemacu USB atau peranti guru.\", \"Buka simulasi dalam mana-mana pelayar — tanpa sambungan.\", \"Tayang atau gilirkan peranti antara kumpulan.\"], lowResource: \"Berjalan dari USB pada satu peranti bercas; sesuai untuk bilik satu skrin tanpa internet.\", alternatives: [\"Tangkapan skrin simulasi bercetak\", \"Model fizikal\", \"Rajah buku teks dengan soalan\"] },\n      },\n    },\n  };\n\n  apiBase() { return (typeof window !== \"undefined\" && window.RET_API_BASE) || \"\"; }\n\n  // --- OCR: extract text on upload so the teacher can review it before analysis ---\n  async extractFile(f) {\n    if (!f) return;\n    this.setState({ extracting: true, extractInfo: null });\n    const base = this.apiBase();\n    try {\n      const fd = new FormData();\n      fd.append(\"file\", f);\n      const r = await fetch(base + \"/api/extract\", { method: \"POST\", body: fd });\n      if (!r.ok) throw new Error(\"extract \" + r.status);\n      const data = await r.json();\n      const text = (data.text || \"\").trim();\n      this.setState({\n        extracting: false,\n        lessonText: text || this.state.lessonText,\n        extractInfo: { live: true, method: data.method || \"\", confidence: (typeof data.confidence === \"number\" ? data.confidence : null), words: data.word_count || (text ? text.split(/\\s+/).length : 0), source: data.source_type || \"\" },\n      });\n    } catch (err) {\n      // No backend reachable — demonstrate the review step with a sample transcription (offline demo).\n      const sample = (this.DATA[this.state.lang] && this.DATA[this.state.lang].sampleLesson) || \"\";\n      this.setState({\n        extracting: false,\n        lessonText: this.state.lessonText || sample,\n        extractInfo: { live: false, method: this.state.lang === \"ms\" ? \"Contoh demo\" : \"Demo sample\", confidence: null, words: sample ? sample.split(/\\s+/).length : 0, source: \"\" },\n      });\n    }\n  }\n\n  // --- On-device \"Recent plans\" history (localStorage; mirrors the lesson_plan table) ---\n  loadRecent() {\n    try { const raw = localStorage.getItem(this.recentKey()); return raw ? JSON.parse(raw) : []; } catch (e) { return []; }\n  }\n  persistRecent(list) {\n    try { localStorage.setItem(this.recentKey(), JSON.stringify(list)); } catch (e) {}\n  }\n  async saveRecent(rec) {\n    try {\n      const r = await fetch(this.apiBase() + \"/api/plans?teacher_id=\" + this.state.teacherId, { method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: JSON.stringify(rec) });\n      if (!r.ok) throw new Error(\"save \" + r.status);\n      await this.refreshRecent();   // pull back the server-assigned row\n      return;\n    } catch (e) {\n      // No backend — cache on-device so history still works offline.\n      const list = [rec, ...this.state.recent.filter(x => x.origin !== \"api\")].slice(0, 12);\n      this.persistRecent(list);\n      this.setState({ recent: list, plansBackend: false });\n    }\n  }\n  // Deleting a plan does not reconsolidate server-side, so the Level-5 profile\n  // would keep naming tools derived from feedback on lessons that no longer\n  // exist. Rebuild it explicitly after any deletion.\n  // Curriculum index. The corpus ships with the app but its embeddings live in\n  // the local database, so a fresh install has NOTHING indexed and every plan\n  // is generated ungrounded until this runs. Surfaced rather than hidden.\n  async loadRagStatus() {\n    try {\n      const r = await fetch(this.apiBase() + \"/api/rag/status\");\n      if (r.ok) { this.setState({ rag: await r.json() }); return; }\n    } catch (e) {}\n    this.setState({ rag: null });\n  }\n\n  async buildIndex() {\n    if (this.state.ragBuilding) return;\n    this.setState({ ragBuilding: true, ragMsg: null });\n    try {\n      const r = await fetch(this.apiBase() + \"/api/rag/reindex\", { method: \"POST\" });\n      const d = r.ok ? await r.json() : null;\n      if (d && d.ok === false) this.setState({ ragMsg: { ok: false, text: d.reason || \"\" } });\n      else if (d) this.setState({ ragMsg: { ok: true, text: String(d.indexed != null ? d.indexed : \"\") } });\n      else this.setState({ ragMsg: { ok: false, text: \"\" } });\n    } catch (e) {\n      this.setState({ ragMsg: { ok: false, text: \"\" } });\n    }\n    this.setState({ ragBuilding: false });\n    await this.loadRagStatus();\n  }\n\n  async rebuildProfile() {\n    try {\n      const r = await fetch(this.apiBase() + \"/api/teachers/\" + this.state.teacherId + \"/profile\", { method: \"POST\" });\n      if (r.ok) {\n        const p = (await r.json()).profile;\n        this.setState({ profile: p || this.computeLocalProfile() });\n        return true;\n      }\n    } catch (e) {}\n    this.setState({ profile: this.computeLocalProfile() });\n    return false;\n  }\n\n  async deleteRecentById(id) {\n    const rec = this.state.recent.find(r => r.id === id);\n    if (rec && rec.origin === \"api\") {\n      try {\n        await fetch(this.apiBase() + \"/api/plans/\" + rec.serverId, { method: \"DELETE\" });\n        await this.refreshRecent();\n        await this.rebuildProfile();\n        return;\n      } catch (e) {}\n    }\n    const list = this.state.recent.filter(r => r.id !== id);\n    this.persistRecent(list);\n    this.setState({ recent: list });\n  }\n  async clearRecentAll() {\n    if (this.state.plansBackend) {\n      try {\n        for (const r of this.state.recent) { if (r.serverId != null) await fetch(this.apiBase() + \"/api/plans/\" + r.serverId, { method: \"DELETE\" }); }\n        await this.refreshRecent();\n        await this.rebuildProfile();\n        return;\n      } catch (e) {}\n    }\n    this.persistRecent([]);\n    this.setState({ recent: [] });\n  }\n  async reopenRecent(rec) {\n    let full = rec;\n    const serverId = (rec.origin === \"api\") ? rec.serverId : null;\n    const fbId = (serverId != null) ? serverId : (\"local:\" + rec.id);\n    if (serverId != null) {\n      try {\n        const r = await fetch(this.apiBase() + \"/api/plans/\" + serverId);\n        if (r.ok) { const data = await r.json(); full = data.payload || data; }\n      } catch (e) {}\n    }\n    this.setState({\n      lang: full.lang || this.state.lang,\n      subjectInput: full.subject || \"\", formInput: full.form || \"\", topicInput: full.topic || \"\",\n      lessonText: full.lessonText || \"\",\n      constraints: full.constraints || this.state.constraints,\n      live: full.live || null, dataSource: full.dataSource || rec.dataSource || \"demo\",\n      showResults: true, activeTab: \"plan\", extractInfo: null,\n      fbPlanId: fbId, fbRating: 0, fbTools: {}, fbNotes: \"\", fbSaved: false,\n    });\n    this.loadFeedback(fbId);\n    this.loadReflection();\n  }\n\n  fbLocalKey(id) { return \"ret_feedback_\" + id + \"_t\" + this.state.teacherId; }\n\n  async loadFeedback(planId) {\n    let fb = null;\n    if (String(planId).startsWith(\"local:\")) {\n      try { const raw = localStorage.getItem(this.fbLocalKey(planId)); if (raw) fb = JSON.parse(raw); } catch (e) {}\n    } else {\n      try {\n        const r = await fetch(this.apiBase() + \"/api/plans/\" + planId + \"/feedback\");\n        if (r.ok) fb = (await r.json()).feedback;\n      } catch (e) {}\n    }\n    if (!fb) return;\n    const tools = {};\n    (fb.tools_worked || []).forEach(t => { tools[t] = \"worked\"; });\n    (fb.tools_flopped || []).forEach(t => { tools[t] = \"flopped\"; });\n    this.setState({ fbRating: fb.rating || 0, fbTools: tools, fbNotes: fb.notes || \"\", fbSaved: true });\n  }\n\n  async loadReflection() {\n    try {\n      const r = await fetch(this.apiBase() + \"/api/reflection?teacher_id=\" + this.state.teacherId);\n      if (r.ok) this.setState({ reflection: await r.json() });\n    } catch (e) {}\n    try {\n      const pr = await fetch(this.apiBase() + \"/api/teachers/\" + this.state.teacherId + \"/profile\");\n      if (pr.ok) {\n        const p = (await pr.json()).profile;\n        this.setState({ profile: p || this.computeLocalProfile() });\n      } else {\n        this.setState({ profile: this.computeLocalProfile() });\n      }\n    } catch (e) {\n      this.setState({ profile: this.computeLocalProfile() });\n    }\n    // L6 — proactive suggestion (server, else derive from the local profile).\n    try {\n      const sg = await fetch(this.apiBase() + \"/api/teachers/\" + this.state.teacherId + \"/suggestion\");\n      if (sg.ok) { this.setState({ suggestion: await sg.json() }); }\n      else { this.setState({ suggestion: this.computeLocalSuggestion() }); }\n    } catch (e) {\n      this.setState({ suggestion: this.computeLocalSuggestion() });\n    }\n  }\n\n  // Offline mirror of the backend suggestion(): derive a 'usual setup' from the\n  // consolidated local profile.\n  computeLocalSuggestion() {\n    const CON = { no_internet:1, limited_connectivity:1, unstable_power:1, mixed_ability:1, large_class:1, restricted_hardware:1 };\n    const p = this.state.profile || this.computeLocalProfile();\n    if (!p) return { available: false, constraints: [], tools: [], lessons_seen: 0 };\n    const constraints = (p.common_constraints || []).filter(k => CON[k]);\n    const tools = (p.go_to_tools || []).slice(0, 4);\n    const lessons = p.lessons_seen || 0;\n    return { available: !!((constraints.length || tools.length) && lessons >= 2), constraints, tools, lessons_seen: lessons };\n  }\n\n  applySuggestion() {\n    const sg = this.state.suggestion;\n    if (!sg || !sg.available) return;\n    const cons = { ...this.state.constraints };\n    (sg.constraints || []).forEach(k => { if (k in cons) cons[k] = true; });\n    this.setState({ constraints: cons, suggestionApplied: true, suggestionDismissed: true });\n  }\n\n  dismissSuggestion() {\n    this.setState({ suggestionDismissed: true });\n  }\n\n  // Offline mirror of the backend consolidate(): build a stable profile from\n  // locally-saved feedback + recent plans so the card works without a server.\n  computeLocalProfile() {\n    const MIN = 2, tid = this.state.teacherId;\n    const worked = {}, flopped = {}, ratings = [];\n    try {\n      const prefix = \"ret_feedback_\", suffix = \"_t\" + tid;\n      for (let i = 0; i < localStorage.length; i++) {\n        const k = localStorage.key(i);\n        if (!k || k.indexOf(prefix) !== 0 || k.indexOf(suffix) !== k.length - suffix.length) continue;\n        const fb = JSON.parse(localStorage.getItem(k) || \"{}\");\n        (fb.tools_worked || []).forEach(t => { worked[t] = (worked[t] || 0) + 1; });\n        (fb.tools_flopped || []).forEach(t => { flopped[t] = (flopped[t] || 0) + 1; });\n        if (fb.rating) ratings.push(fb.rating);\n      }\n    } catch (e) { return null; }\n    const tools = new Set([...Object.keys(worked), ...Object.keys(flopped)]);\n    const go = [], avoid = [];\n    tools.forEach(t => {\n      const net = (worked[t] || 0) - (flopped[t] || 0);\n      if (net >= MIN) go.push([t, net]);\n      else if (net <= -MIN) avoid.push([t, -net]);\n    });\n    go.sort((a, b) => b[1] - a[1]); avoid.sort((a, b) => b[1] - a[1]);\n    // recurring constraints across recent plans\n    const conCounts = {}; let nPlans = 0;\n    (this.state.recent || []).forEach(r => {\n      let cons = r.constraints || [];\n      if (cons && !Array.isArray(cons)) cons = Object.keys(cons).filter(k => cons[k]);\n      if (cons.length) nPlans++;\n      cons.forEach(k => { conCounts[k] = (conCounts[k] || 0) + 1; });\n    });\n    const thresh = Math.max(2, Math.floor((nPlans + 2) / 3));\n    const commonCon = Object.keys(conCounts).filter(k => conCounts[k] >= thresh).sort((a, b) => conCounts[b] - conCounts[a]);\n    const feedbackCount = ratings.length + (Object.keys(worked).length ? 1 : 0);\n    if (!go.length && !avoid.length && !commonCon.length) return null;\n    return {\n      go_to_tools: go.map(x => x[0]),\n      avoid_tools: avoid.map(x => x[0]),\n      common_constraints: commonCon,\n      avg_rating: ratings.length ? Math.round((ratings.reduce((a, b) => a + b, 0) / ratings.length) * 100) / 100 : null,\n      lessons_seen: ratings.length,\n    };\n  }\n\n  cycleFbTool(name) {\n    this.setState(st => {\n      const next = { ...st.fbTools };\n      const cur = next[name];\n      if (!cur) next[name] = \"worked\";\n      else if (cur === \"worked\") next[name] = \"flopped\";\n      else delete next[name];\n      return { fbTools: next, fbSaved: false };\n    });\n  }\n\n  async saveFeedback() {\n    const planId = this.state.fbPlanId;\n    if (planId == null) return;\n    const worked = [], flopped = [];\n    Object.entries(this.state.fbTools).forEach(([t, v]) => { (v === \"worked\" ? worked : flopped).push(t); });\n    const body = {\n      teacher_id: this.state.teacherId,\n      rating: this.state.fbRating || null,\n      tools_worked: worked, tools_flopped: flopped,\n      notes: (this.state.fbNotes || \"\").trim(),\n      taught_on: new Date().toISOString().slice(0, 10),\n    };\n    if (String(planId).startsWith(\"local:\")) {\n      try { localStorage.setItem(this.fbLocalKey(planId), JSON.stringify(body)); } catch (e) {}\n      this.setState({ fbSaved: true });\n      this.loadReflection();\n      return;\n    }\n    try {\n      const r = await fetch(this.apiBase() + \"/api/plans/\" + planId + \"/feedback\", {\n        method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: JSON.stringify(body),\n      });\n      if (r.ok) { this.setState({ fbSaved: true }); this.loadReflection(); }\n    } catch (e) {}\n  }\n\n  selectedConstraintLabels() {\n    const sel = this.state.constraints;\n    return this.constraintDefs.filter(c => sel[c.key]).map(c => c.en);\n  }\n\n  async fetchLive() {\n    const base = this.apiBase();\n    const post = async (path, body) => {\n      const r = await fetch(base + path, { method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: JSON.stringify(body) });\n      if (!r.ok) throw new Error(path + \" \" + r.status);\n      return r.json();\n    }; er-radius:50%;display:inline-block;\"\n        + (this.state.engineKnown && !this.state.engineLive\n            ? \"background:#d1a63a;box-shadow:0 0 0 3px rgba(209,166,58,.22);\"\n            : \"background:#33a94a;box-shadow:0 0 0 3px rgba(51,169,74,.22);\"),\n      engineLabel: !this.state.engineKnown\n        ? s.offline\n        : (this.state.engineLive ? s.offlineAi : s.offlineBasic),\n      modelValue: this.state.modelValue,\n      onModelChange: (e) => this.onModelChange(e),\n      // Reviewer download. Hidden entirely until a URL exists, so the demo never\n      // shows a dead link before the release is published.\n      downloadHref: this.installerUrl(),\n      hasDownload: !!this.installerUrl(),\n      faqChips,\n      faqQuery: this.state.faqQuery,\n      setFaqQuery: (e) => this.setState({ faqQuery: e.target.value }),\n      faqItems: this.state.faqItems.map(it => ({\n        ...it,\n        hasSteps: !it.pending && it.steps && it.steps.length > 0,\n        hasAlts: !it.pending && it.alternatives && it.alternatives.length > 0,\n        isPending: !!it.pending,\n        notPending: !it.pending,\n        hasEngine: !it.pending && !!it.poweredBy,\n        engineLabel: it.poweredBy === \"rule-based\" ? s.faqEngineRule : s.faqEngineAi,\n        engineStyle: \"font-size:.68rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;flex:none;\"\n          + (it.poweredBy === \"rule-based\" ? \"background:#e9eff6;color:#2f6aa8;\" : \"background:#e3f4e7;color:#1f6b38;\"),\n      })),\n      hasFaqItems: this.state.faqItems.length > 0,\n      submitFaq: () => { const q = this.state.faqQuery.trim(); if (q) askFaqFn(q); },\n      faqKeyDown: (e) => { if (e.key === \"Enter\") { const q = this.state.faqQuery.trim(); if (q) askFaqFn(q); } },\n      doPrint: () => window.print(),\n      printedOn: new Date().toLocaleDateString(L === \"en\" ? \"en-GB\" : \"ms-MY\", { day: \"2-digit\", month: \"long\", year: \"numeric\" }),\n      erphTema: plan.tema,\n      erphSK: \"DSKP 2.1 — \" + plan.topic,\n      // Learning standards are matched by prefix when the model labels them\n      // (\"SP 1.2.2\", \"LS 2.1.1\"), but a small model often returns bare numbers.\n      // Filtering those out left the SP row blank on the printed ERPH, which a\n      // teacher must fill in by hand — so fall back to numbered standards, then\n      // to the full list, rather than printing nothing.\n      erphSP: (() => {\n        const all = analyst.standards || [];\n        const labelled = all.filter(x => /\\b(LS|SP)\\b/i.test(x));\n        if (labelled.length) return labelled;\n        const numbered = all.filter(x => /\\d+\\.\\d+(\\.\\d+)?/.test(x));\n        return numbered.length ? numbered : all;\n      })(),\n      erphTMK: plan.tools.join(\", \"),\n      erphPhaseRows: (plan.phases || []).map((p, i, arr) => {\n        // Build every phase row from the plan itself. The old version had four\n        // hard-coded slots fed by demo-only fields (erph_langkah2, penutup),\n        // so against the live API Step 2 / Closure printed blank and any phase\n        // past the third was dropped entirely.\n        const last = i === arr.length - 1;\n        const label = i === 0 ? \"Set Induksi\" : last ? \"Penutup / Refleksi\" : \"Aktiviti Utama — Langkah \" + i;\n        const labelEn = i === 0 ? \"Set Induction\" : last ? \"Closure\" : \"Main Activity — Step \" + i;\n        return {\n          label, labelEn,\n          duration: p.duration ? p.duration + \".\" : \"\",\n          activity: p.activity || \"\",\n          tech: p.technology ? \"(\" + p.technology + \")\" : \"\",\n        };\n      }),\n      hasKbat: !!((plan.kbat_level || \"\").trim() || (plan.kbat || []).length),\n      erphKbatLevel: plan.kbat_level,\n      erphKbat: plan.kbat,\n      erphPbd: plan.pbd,\n      erphKeyStyle: \"border:1px solid #999;padding:4px 8px;background:#e9eff6;font-weight:700;color:#16385a;width:20%;vertical-align:top;\",\n
